name: Validate control plane
on:
  pull_request:
  push:
    paths: ['scripts/**', 'config/**', 'tests/**', 'requirements.txt', '.github/workflows/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Generate identity from current configuration
        run: python scripts/generate_profile.py
      - name: Test behavior and reproducibility
        run: python -m unittest discover -s tests -v
