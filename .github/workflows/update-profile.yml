name: Update control plane
on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'
  push:
    branches: [main]
    paths: ['config/**', 'scripts/**', 'requirements.txt', '.github/workflows/update-profile.yml']
permissions:
  contents: write
concurrency:
  group: profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test generators
        run: python -m unittest discover -s tests -v
      - name: Generate identity
        run: python scripts/generate_profile.py
      - name: Refresh public telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_telemetry.py
      - name: Commit changed outputs
        run: |
          git add README.md assets/static assets/generated
          if git diff --cached --quiet; then
            echo "Profile outputs are unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): refresh telemetry'
          git push origin HEAD:${{ github.event.repository.default_branch }}
